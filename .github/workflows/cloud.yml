name: cloud

# 云端更新（电脑关机/睡眠时兜底）：GitHub 机房实测能直接访问澳客 m 站（200），
# 体彩(567)/500(403) 抓不到就跳过对应步骤，只用澳客口径重建页面。
# 注意：用 GITHUB_TOKEN 提交不会触发其它工作流，所以发布也在这里直接做。
on:
  schedule:
    - cron: '11,41 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: 本机刚推过就跳过（避免云端覆盖本机更全的那版）
        id: check
        run: |
          set +e
          LAST_EPOCH=$(git log -1 --format=%ct)
          NOW=$(date +%s)
          AGE=$(( (NOW - LAST_EPOCH) / 60 ))
          AUTHOR=$(git log -1 --format=%an)
          echo "last commit by $AUTHOR · ${AGE} 分钟前"
          if [ "$AUTHOR" != "hb-cloud-bot" ] && [ $AGE -lt 25 ]; then
            echo "skip=1" >> $GITHUB_OUTPUT
          else
            echo "skip=0" >> $GITHUB_OUTPUT
          fi

      - uses: actions/setup-python@v5
        if: steps.check.outputs.skip == '0'
        with:
          python-version: '3.11'

      - name: 云端一轮（抓澳客 → 建页 → 门禁）
        id: cycle
        run: |
          set +e
          python scripts/cloud_cycle.py
          rc=$?
          echo "rc=$rc"
          if [ $rc -eq 2 ]; then
            git checkout -- index.html 2>/dev/null || true
            echo "gate=fail" >> $GITHUB_OUTPUT
            exit 1
          fi
          echo "gate=pass" >> $GITHUB_OUTPUT

      - name: 提交新页面
        if: steps.cycle.outputs.gate == 'pass'
        run: |
          git config user.name  "hb-cloud-bot"
          git config user.email "hb-cloud-bot@users.noreply.github.com"
          git add index.html engine/data || true
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "cloud: 云端自动更新 $(date -u '+%F %H:%M') UTC"
            # ★ 第二一七条：本机每 15 分钟也在推，云端直接 push 会 non-fast-forward 报错
            #   → 先 rebase 再推，最多重试 4 次；冲突时保留云端这一版页面（--ours 逻辑用 rebase 的 theirs）
            ok=0
            for i in 1 2 3 4; do
              if git pull --rebase -X ours --autostash origin main && git push; then ok=1; break; fi
              echo "push 第 $i 次失败，5 秒后重试"
              sleep 5
            done
            if [ "$ok" != "1" ]; then echo "云端推送连续失败，本轮不发布"; exit 1; fi
          fi

      - name: 打包 Pages 产物
        if: steps.cycle.outputs.gate == 'pass'
        run: |
          mkdir -p public
          cp index.html public/index.html
          printf '' > public/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        if: steps.cycle.outputs.gate == 'pass'
        with:
          path: public

      - name: 等待产物索引就绪
        if: steps.cycle.outputs.gate == 'pass'
        run: sleep 10

      - name: 发布到 GitHub Pages
        id: deployment
        if: steps.cycle.outputs.gate == 'pass'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: 发布重试（仅在上一步失败时）
        if: steps.cycle.outputs.gate == 'pass' && steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
