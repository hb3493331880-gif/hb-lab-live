name: probe2
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 精确探测（带/不带 Referer 的差异）
        run: |
          set +e
          UA_M="Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1"
          out=probe_log2.txt
          : > $out
          echo "run at $(date -u '+%F %T') UTC" >> $out

          echo "=== A: 无 Referer ===" >> $out
          code=$(curl -s -o /tmp/a.html -w "%{http_code}" -m 25 -A "$UA_M" "https://m.okooo.com/zucai/?LotteryNo=26166")
          echo "A code=$code bytes=$(wc -c < /tmp/a.html) 拜仁=$(grep -c '拜仁' /tmp/a.html) 赔率节点=$(grep -c 'odds' /tmp/a.html)" >> $out

          echo "=== B: 带 Referer（脚本现在的写法）===" >> $out
          code=$(curl -s -o /tmp/b.html -w "%{http_code}" -m 25 -A "$UA_M" -e "https://m.okooo.com/" "https://m.okooo.com/zucai/?LotteryNo=26166")
          echo "B code=$code bytes=$(wc -c < /tmp/b.html) 拜仁=$(grep -c '拜仁' /tmp/b.html)" >> $out

          echo "=== C: 带 Referer + Accept-Language ===" >> $out
          code=$(curl -s -o /tmp/c.html -w "%{http_code}" -m 25 -A "$UA_M" -e "https://m.okooo.com/zucai/" -H "Accept-Language: zh-CN,zh;q=0.9" "https://m.okooo.com/zucai/?LotteryNo=26166")
          echo "C code=$code bytes=$(wc -c < /tmp/c.html) 拜仁=$(grep -c '拜仁' /tmp/c.html)" >> $out

          echo "=== 内容抽样（A 文件里的队名/赔率行）===" >> $out
          grep -o '格鲁吉\|匈牙利\|拜仁\|赔率' /tmp/a.html | sort | uniq -c | head -20 >> $out
          echo "--- 前 300 字节 ---" >> $out
          head -c 300 /tmp/a.html >> $out
          echo "" >> $out

          echo "=== 情报页 form.php ===" >> $out
          code=$(curl -s -o /tmp/f.html -w "%{http_code}" -m 25 -A "$UA_M" "https://m.okooo.com/match/form.php?id=1")
          echo "form code=$code bytes=$(wc -c < /tmp/f.html)" >> $out

          echo "=== 新浪历史赛果 2026-11-15 ===" >> $out
          code=$(curl -s -o /tmp/s.html -w "%{http_code}" -m 25 -A "$UA_M" "https://match.sports.sina.com.cn/football/index.php?d=2026-11-15")
          echo "sina code=$code bytes=$(wc -c < /tmp/s.html) 鹿岛=$(grep -c '鹿岛' /tmp/s.html) 横滨=$(grep -c '横滨' /tmp/s.html)" >> $out
          echo "--- sina 里的数据接口地址 ---" >> $out
          grep -o 'https\?://[^"'"'"' ]*\.\(js\|php\|json\)[^"'"'"' ]*' /tmp/s.html | head -8 >> $out
          echo done
      - name: 提交结果
        run: |
          git config user.name  "probe-bot"
          git config user.email "probe-bot@users.noreply.github.com"
          git add probe_log2.txt
          git commit -m "test(probe2): 澳客/新浪 精确探测" || true
          git push || true
