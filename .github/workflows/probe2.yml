name: probe2
on:
  workflow_dispatch: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: 探测任九期次页结构（找 matchid）
        run: |
          set +e
          UA_M="Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1"
          curl -sS -m 30 -A "$UA_M" -e "https://m.okooo.com/" -o sfc.html "https://m.okooo.com/zucai/?LotteryNo=26166"
          wc -c sfc.html
          echo "--- href 含 match ---"
          grep -oE 'href="[^"]*match[^"]*"' sfc.html | head -20
          echo "--- 任意 6-7 位数字 ---"
          grep -oE '[0-9]{6,7}' sfc.html | sort -u | head -30
          echo "--- listItem 片段 ---"
          python3 - <<'PY'
          import re, io
          t = io.open('sfc.html', encoding='gbk', errors='ignore').read()
          i = t.find('listItem')
          print('len', len(t), 'idx', i)
          if i > 0:
              print(t[max(0, i-600):i+1400])
          print('ids:', sorted(set(re.findall(r'\d{6,7}', t)))[:30])
          PY
