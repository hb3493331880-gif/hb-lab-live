name: probe4
on:
  workflow_dispatch: {}
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - name: 找球队页/主教练字段
        run: |
          set +e
          UA="Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1"
          curl -sS -m 25 -A "$UA" -e "https://m.okooo.com/" -o m.html "https://m.okooo.com/match/history.php?MatchID=1336396&from="
          echo "--- team links ---"
          grep -oE 'href="[^"]*(team|Team)[^"]*"' m.html | head -10
          echo "--- 教练 keyword count ---"
          grep -c "教练" m.html || true
          TID=$(grep -oE 'TeamID=[0-9]+' m.html | head -1 | cut -d= -f2)
          echo "TID=$TID"
          if [ -n "$TID" ]; then
            for u in "https://m.okooo.com/team/?TeamID=$TID" "https://m.okooo.com/team/index.php?TeamID=$TID"; do
              echo "=== $u"
              curl -sS -m 25 -A "$UA" -e "https://m.okooo.com/" -o t.html "$u"
              wc -c t.html
              grep -o "教练[^<|]\{0,25\}" t.html | head -6
            done
          fi
