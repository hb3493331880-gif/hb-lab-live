name: auto

# 云端全自动：抓竞彩/任九/北单/赛果 → 构建 → 发布 Pages
# 关键保护：产物必须过质量门禁（含变盘/校准/北单实时源），否则回退到仓库里上一版好页面，
# 绝不让「云端跑出薄页」把线上覆盖掉。
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: auto
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 抓竞彩（澳客）
        run: python scripts/fetch_okooo_lottery.py jc || echo "jc skip"
        continue-on-error: true

      - name: 抓任九赔率（澳客）
        run: python scripts/fetch_sfc_okooo.py || echo "sfc skip"
        continue-on-error: true

      - name: 抓北单（手机版 + 官方 WDL.xml）
        run: python scripts/fetch_bj_mobile.py || echo "bj skip"
        continue-on-error: true

      - name: 抓赛果（竞彩赛果公告 12 天）
        run: python scripts/fetch_results_all.py || echo "res skip"
        continue-on-error: true

      - name: 退役/告别公告
        run: python scripts/fetch_retire.py || echo "retire skip"
        continue-on-error: true

      - name: 变盘追踪
        run: python scripts/odds_delta.py || echo "odds skip"
        continue-on-error: true

      - name: 构建页面
        run: python scripts/build.py

      - name: 产物质量门禁（不合格就回退上一版）
        id: gate
        run: |
          set -e
          SIZE=$(stat -c%s index.html)
          BJ=$(grep -c "window.__BJ_TODAY__" index.html || true)
          CAL=$(grep -c "【同档校准·已开】" index.html || true)
          VAR=$(grep -c "【变盘】" index.html || true)
          echo "size=$SIZE bj=$BJ cal=$CAL var=$VAR"
          if [ "$SIZE" -lt 1000000 ] || [ "$CAL" -lt 1 ] || [ "$VAR" -lt 1 ]; then
            echo "❌ 云端构建产物不完整，回退到仓库上一版 index.html"
            git checkout -- index.html
            echo "fallback=true" >> $GITHUB_OUTPUT
          else
            echo "✅ 门禁通过"
            echo "fallback=false" >> $GITHUB_OUTPUT
          fi

      - name: 准备发布目录
        run: |
          mkdir -p public
          cp index.html public/
          touch public/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deployment
        uses: actions/deploy-pages@v4
