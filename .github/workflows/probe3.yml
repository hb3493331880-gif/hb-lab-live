name: probe3
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 直接跑任九抓取脚本
        run: |
          set +e
          out=probe_log3.txt
          : > $out
          echo "run at $(date -u '+%F %T') UTC" >> $out
          echo "=== 任九脚本在 runner 上是否解析成功 ===" >> $out
          python scripts/fetch_sfc_okooo.py --no-merge >> $out 2>&1
          echo "exit=$?" >> $out
      - name: 竞彩/北单 备用源探测
        run: |
          set +e
          out=probe_log3.txt
          UA_M="Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1"
          UA_D="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36"
          echo "=== 竞彩/北单 候选源 ===" >> $out
          for u in \
            "https://www.okooo.com/jingcai/" \
            "https://m.okooo.com/jingcai/" \
            "https://m.okooo.com/beidan/" \
            "https://www.okooo.com/beidan/" \
            "https://live.500.com/" \
            "https://odds.500.com/fenxi/" \
            "https://www.leisu.com/odds" \
            "https://data.leisu.com/" \
            "https://www.titan007.com/odds/" \
            "https://m.okooo.com/live/?date=2026-11-15"
          do
            code=$(curl -s -o /tmp/p.html -w "%{http_code}" -m 25 -A "$UA_M" -L "$u")
            echo "$code $(wc -c < /tmp/p.html) $u" >> $out
          done
          echo "=== 桌面 UA 访问澳客竞彩 ===" >> $out
          code=$(curl -s -o /tmp/d.html -w "%{http_code}" -m 25 -A "$UA_D" "https://www.okooo.com/jingcai/")
          echo "$code $(wc -c < /tmp/d.html) desktop-okooo-jingcai" >> $out
          echo done
      - name: 提交结果
        run: |
          git config user.name  "probe-bot"
          git config user.email "probe-bot@users.noreply.github.com"
          git add probe_log3.txt
          git commit -m "test(probe3): runner 上跑任九抓取 + 竞彩备用源" || true
          git push || true
