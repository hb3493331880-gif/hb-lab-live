name: probe3
on:
  workflow_dispatch: {}
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - name: 澳客比赛页是否带主教练
        run: |
          set +e
          UA="Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1"
          for u in "https://m.okooo.com/match/form.php?MatchID=1336396&from=" "https://m.okooo.com/match/history.php?MatchID=1336396&from=" "https://m.okooo.com/match/game.php?MatchID=1336396&from="; do
            echo "=== $u"
            curl -sS -m 25 -A "$UA" -e "https://m.okooo.com/" -o p.html "$u"
            wc -c p.html
            grep -o "教练[^<|]\{0,20\}" p.html | head -5
            grep -o "主教练[^<|]\{0,20\}" p.html | head -5
          done
