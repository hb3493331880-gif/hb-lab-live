name: probe
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 探测并落盘
        run: |
          set +e
          UA_PC="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
          UA_M="Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1"
          probe () { code=$(curl -s -o /tmp/o -w "%{http_code}" -m 20 -A "$2" "$1"); sz=$(wc -c < /tmp/o); printf "%-8s %9s  %s\n" "$code" "$sz" "$1"; }
          out=probe_log.txt
          : > $out
          echo "run at $(date -u '+%F %T') UTC" >> $out
          echo "=== 体彩官方 ===" >> $out
          probe "https://webapi.sporttery.cn/gateway/uniform/football/getMatchCalculatorV1.qry?poolCode=hhad&channel=c" "$UA_PC" >> $out 2>&1
          probe "https://www.sporttery.cn/" "$UA_PC" >> $out 2>&1
          echo "=== 澳客 ===" >> $out
          probe "https://m.okooo.com/zucai/?LotteryNo=26166" "$UA_M" >> $out 2>&1
          probe "https://www.okooo.com/" "$UA_PC" >> $out 2>&1
          probe "https://m.okooo.com/live/" "$UA_M" >> $out 2>&1
          echo "=== 500 ===" >> $out
          probe "https://odds.500.com/" "$UA_PC" >> $out 2>&1
          probe "https://live.500.com/" "$UA_PC" >> $out 2>&1
          echo "=== 雷速 ===" >> $out
          probe "https://www.leisu.com/" "$UA_PC" >> $out 2>&1
          probe "https://api.leisu.com/api/v1/match/list" "$UA_PC" >> $out 2>&1
          echo "=== 球探 ===" >> $out
          probe "https://www.titan007.com/" "$UA_PC" >> $out 2>&1
          probe "https://vip.titan007.com/AsianOdds_n.aspx?id=1" "$UA_PC" >> $out 2>&1
          echo "=== 捷报 ===" >> $out
          probe "https://www.nowscore.com/" "$UA_PC" >> $out 2>&1
          probe "https://live.nowscore.com/" "$UA_PC" >> $out 2>&1
          echo "=== 懂球帝 ===" >> $out
          probe "https://www.dongqiudi.com/" "$UA_PC" >> $out 2>&1
          echo "=== 直播吧 ===" >> $out
          probe "https://news.zhibo8.com/zuqiu/" "$UA_PC" >> $out 2>&1
          echo "=== 新浪 ===" >> $out
          probe "https://match.sports.sina.com.cn/football/index.php?d=2026-11-15" "$UA_PC" >> $out 2>&1
          echo "=== 中转 ===" >> $out
          probe "https://r.jina.ai/https://m.okooo.com/zucai/?LotteryNo=26166" "$UA_PC" >> $out 2>&1
          echo done
      - name: 提交探测结果
        run: |
          git config user.name  "probe-bot"
          git config user.email "probe-bot@users.noreply.github.com"
          git add probe_log.txt
          git commit -m "test(probe): GitHub 机房各数据源可达性结果" || true
          git push || true