name: daily

# 发布器：本机负责抓数据+构建+推送，本工作流负责「一推就发」，并每 30 分钟兜底重发。
# 为什么不在 runner 上抓数据：GitHub 机房 IP 被体彩(567)/澳客(405)按地域拦截。
on:
  push:
    branches: [main]
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: 产物检查
        run: |
          SIZE=$(stat -c%s index.html)
          echo "index.html = $SIZE bytes"
          grep -c "【变盘】" index.html || true
          grep -c "立即更新" index.html || true

      - name: 收进 public/
        run: |
          mkdir -p public
          cp index.html public/index.html
          printf '' > public/.nojekyll

      - name: 打包 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      # ★ 第二一三条：发布偶发失败的真正原因（已抓日志确认）
      #   upload-pages-artifact 成功、artifact 已 finalize，
      #   但紧接着 deploy-pages 调 artifacts API 却返回 "Found 0 artifact(s)"
      #   → 产物刚上传完、索引还没同步（GitHub 侧竞态），不是我们构建的问题。
      #   修法：发布前等 10 秒让产物索引落盘；失败再自动重试一次。
      - name: 等待产物索引就绪
        run: sleep 10

      - name: 发布到 GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: 发布重试（仅在上一步失败时）
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4

      - name: 回读线上首页
        if: always()
        run: |
          curl -sS -o /tmp/live.html -w "HTTP %{http_code}  %{size_download} B\n" "https://hb3493331880-gif.github.io/hb-lab-live/" || true
          grep -o '<title>[^<]*</title>' /tmp/live.html || true
          grep -o 'window.__LIVE__="generated"[^,]*' /tmp/live.html | head -1 || true
          grep -o '"generated":"[^"]*"' /tmp/live.html | tail -1 || true
