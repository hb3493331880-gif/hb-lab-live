name: daily

# 发布器：本机负责抓数据+构建+推送，本工作流负责「一推就发」，并每 30 分钟兜底重发。
# 为什么不在 runner 上抓数据：GitHub 机房 IP 被体彩(567)/澳客(405)按地域拦截。
on:
  push:
    branches: [main]
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: 产物检查
        run: |
          SIZE=$(stat -c%s index.html)
          echo "index.html = $SIZE bytes"
          grep -c "【变盘】" index.html || true
          grep -c "立即更新" index.html || true

      - name: 收进 public/
        run: |
          mkdir -p public
          cp index.html public/index.html
          printf '' > public/.nojekyll

      - name: 打包 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: 回读线上首页
        run: |
          curl -sS -o /tmp/live.html -w "HTTP %{http_code}  %{size_download} B\n" "${{ steps.deployment.outputs.page_url }}" || true
          grep -o '<title>[^<]*</title>' /tmp/live.html || true
