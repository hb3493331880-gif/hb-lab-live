name: daily

# 发布器（只负责把已生成的页面发到 GitHub Pages）
#
# 为什么不再在 Actions 里抓数据：
#   GitHub 机房 IP 被体彩（HTTP 567）和澳客（HTTP 405）直接封掉，
#   在 runner 上抓不到任何赔率/情报。数据必须由本机（家宽 IP）抓：
#   本机跑 python scripts/build.py → 提交 index.html 与 engine/data → 本工作流发布。
#
# 触发：每 30 分钟一次（兜底重发最新提交里的页面），也可手动 Run workflow。
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: 收进 public/
        run: |
          mkdir -p public
          cp index.html public/index.html
          printf '' > public/.nojekyll
          ls -l public

      - name: 打包 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: 回读线上首页
        run: |
          curl -sS -o /tmp/live.html -w "HTTP %{http_code}  %{size_download} B\n" "${{ steps.deployment.outputs.page_url }}" || true
          grep -o '<title>[^<]*</title>' /tmp/live.html || true
